[package]
name = "okfs-engine"
version = "0.0.0"
edition = "2024"
publish = false

# okfs's own index, compiled for the browser: src/lib.rs pulls src/index.rs, src/paths.rs,
# src/skip.rs, src/live.rs and src/every.rs from this checkout as they are. Build it for
# wasm32-wasip1 (see ../build.sh). It is not part of okfs's own build.

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
dirs = "7.0.0"
futures-util = "0.3.34"
ignore = "0.4"
notify = "8.2.0"
nucleo-matcher = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["sync", "macros"] }
tokio-util = { version = "0.7.20" }
