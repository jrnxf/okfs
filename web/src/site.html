<meta charset="utf-8">

<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3ecdc">
<script>
  // The demo lived at this address until it moved to /demo/: a link to it with a query, or to one of its
  // sections, goes on to the demo.
  (function () {
    var demo = ["search", "how", "keys", "keys-sec", "previews", "themes", "binary", "top"];
    if (location.search || demo.indexOf(location.hash.slice(1)) >= 0) location.replace("/demo/" + location.search + location.hash);
  })();
  // Before first paint: the scheme a visitor chose, or the system's.
  (function () {
    var t = null;
    try { t = localStorage.getItem("okfs-site.theme"); } catch (e) {}
    var pick = t === "dark" || t === "light" ? t : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = pick;
    document.querySelector('meta[name="theme-color"]').setAttribute("content", pick === "dark" ? "#1a1815" : "#f3ecdc");
  })();
</script>
