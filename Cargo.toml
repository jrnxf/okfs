[package]
name = "okfs"
version = "0.1.0-dev.1"
edition = "2024"
description = "A web file browser. Run it in a folder and flip through every file inside."
readme = "README.md"
license = "MIT"
keywords = ["file-server", "file-browser", "http", "preview"]
categories = ["command-line-utilities", "web-programming::http-server"]
publish = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Image decoding and syntax highlighting are far too slow unoptimised to test against.
[profile.dev.package."*"]
opt-level = 2

[features]
default = ["pdf"]
# The first page of a PDF as a picture. Turn it off for a binary about 6 MB smaller: --no-default-features.
pdf = ["dep:hayro", "dep:rustix"]

[dependencies]
ammonia = "4.2.3"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
dirs = "7.0.0"
futures-util = "0.3.34"
hayro = { version = "0.8.0", optional = true }
httpdate = "1.0.3"
ignore = "0.4"
if-addrs = { version = "0.15.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
mime_guess = "2.0.5"
notify = "8.2.0"
nucleo-matcher = "0.3.1"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.4"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-onig"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "sync", "signal", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
webbrowser = "1.2.4"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"], optional = true }

# musl's allocator serializes every thread on one lock, which the parallel walk and the previews hit hard:
# the static Linux builds allocate with mimalloc instead.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
