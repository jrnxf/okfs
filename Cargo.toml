[package]
name = "okfs"
version = "0.1.0-dev.1"
edition = "2024"
description = "An open-source web file browser in one binary: run it in a folder and browse every file in your browser, with previews and instant search."
readme = "README.md"
repository = "https://github.com/jrnxf/okfs"
license = "MIT"
keywords = ["file-server", "file-browser", "http", "preview"]
categories = ["command-line-utilities", "web-programming::http-server"]
# Held back until the first release: a published version can never be deleted, only yanked.
publish = false
# What cargo package ships. ui/dist is the built page, so a cargo install needs no bun.
include = ["/src/**", "/build.rs", "/themes/**", "/ui/dist/**", "/ui/src/styles/tokens.css", "/README.md", "/LICENSE", "/THIRD_PARTY.md", "/about.*"]

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Image decoding and syntax highlighting are far too slow unoptimised to test against.
[profile.dev.package."*"]
opt-level = 2

[features]
default = ["pdf"]
# The first page of a PDF as a picture. Turn it off for a binary about 6 MB smaller: --no-default-features.
pdf = ["dep:hayro"]

[dependencies]
ammonia = "4.2.3"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
clap_mangen = "0.2.33"
csv = "1.4.0"
dirs = "7.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
hayro = { version = "0.8.0", optional = true }
httpdate = "1.0.3"
ignore = "0.4"
jiff = "0.2.38"
if-addrs = { version = "0.15.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
mime_guess = "2.0.5"
notify = "8.2.0"
nucleo-matcher = "0.3.1"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.4"
# HMAC for the read-only passes a framed page gets. TLS already builds it.
ring = "0.17.14"
# TLS for --tls-cert and --tls-key, with ring as the crypto: it builds with the C compiler the
# release builds already have.
rustls-pki-types = { version = "1.15.1", features = ["std"] }
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-onig"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "sync", "signal", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
webbrowser = "1.2.4"
zip = { version = "9.0.2", default-features = false, features = ["deflate", "jiff-02"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# musl's allocator serializes every thread on one lock, which the parallel walk and the previews hit hard:
# the static Linux builds allocate with mimalloc instead.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"

[dev-dependencies]
http-body-util = "0.1.5"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

# A test runs okfs with a seccomp filter that makes a rename answer as an NFS share does.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2.190"
