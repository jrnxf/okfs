name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The four commands under "Develop" in the README, run in the flake's dev shell.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-checks-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-checks-${{ runner.os }}-
          gc-max-store-size-linux: 3G

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.bun/install/cache
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'ui/bun.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install the page's dependencies
        run: nix develop -c bun install --frozen-lockfile
        working-directory: ui

      - name: Test
        run: nix develop -c cargo test

      - name: Clippy
        run: nix develop -c cargo clippy --all-targets -- -D warnings

      - name: Format
        run: nix develop -c cargo fmt --check

      - name: Type check the page
        run: nix develop -c bun run check
        working-directory: ui

  # The nix package builds and runs.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-package-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.lock', 'ui/bun.lock') }}
          restore-prefixes-first-match: nix-package-${{ runner.os }}-
          gc-max-store-size-linux: 3G

      - name: Build
        run: nix build --print-build-logs

      - name: Run
        run: ./result/bin/okfs --version

      - name: Flake check
        run: nix flake check
