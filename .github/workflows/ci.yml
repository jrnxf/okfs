name: ci

on:
  pull_request:
  push:
    branches: [main]
  # A new advisory shows up without a push.
  schedule:
    - cron: "17 6 * * 1"

# A newer push to the same PR makes the older run pointless. A push to main is never cancelled:
# every merge keeps its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The tests, in the flake's dev shell, with and without the PDF preview.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-checks-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-checks-${{ runner.os }}-
          gc-max-store-size-linux: 3G

      # rust-cache asks cargo and rustc for the key, so the dev shell's ones go on PATH first.
      - name: Put the dev shell's Rust on PATH
        run: nix develop -c which cargo rustc | xargs -n1 dirname >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Test
        run: nix develop -c cargo nextest run --locked

      # nextest does not run doctests.
      - name: Doctests
        run: nix develop -c cargo test --locked --doc

      - name: Test without the PDF preview
        run: nix develop -c cargo nextest run --locked --no-default-features

  # The format, clippy and type checks under "Develop" in the README, in the flake's dev shell.
  # The format check comes first, as it fails in seconds.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # The same store as checks: one dev shell, one cache.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-checks-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-checks-${{ runner.os }}-
          gc-max-store-size-linux: 3G
          save: false

      - name: Format
        run: nix develop -c cargo fmt --check

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install the page's dependencies
        run: nix develop -c bun install --frozen-lockfile
        working-directory: ui

      - name: Type check the page
        run: nix develop -c bun run check
        working-directory: ui

      - name: Put the dev shell's Rust on PATH
        run: nix develop -c which cargo rustc | xargs -n1 dirname >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: nix develop -c cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy without the PDF preview
        run: nix develop -c cargo clippy --locked --all-targets --no-default-features -- -D warnings

  # okfs builds with the oldest Rust that Cargo.toml names in rust-version.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install the Rust that Cargo.toml names
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version"
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"
          rustc --version

      - name: Build
        run: cargo check --locked --all-targets

  # RustSec advisories for both lockfiles. A vulnerability fails the job; warnings (unmaintained,
  # unsound) are listed and do not.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit

      - name: Audit okfs
        run: cargo audit --file Cargo.lock

      - name: Audit the site's engine
        run: cargo audit --file web/engine/Cargo.lock

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # The page compiled into okfs. bun audit reads ui/bun.lock and installs nothing.
      - name: Audit the page
        run: bun audit
        working-directory: ui

      # The site's build and deploy tools. Workers Builds has only Node, so web/ keeps an npm lock.
      - name: Audit the site
        run: npm audit
        working-directory: web

  # The nix package builds and runs.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-package-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.lock', 'ui/bun.lock') }}
          restore-prefixes-first-match: nix-package-${{ runner.os }}-
          gc-max-store-size-linux: 3G

      # The compiled dependencies are built by name too, so they are a root the garbage collection
      # before the cache save keeps: the next run with the same Cargo.lock builds only okfs.
      - name: Build
        run: nix build --print-build-logs .#default .#default.cargoArtifacts

      - name: Run
        run: ./result/bin/okfs --version

      - name: Flake check
        run: nix flake check

  # The release ships macOS binaries: okfs builds and its tests pass there too.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # The compiled dependencies. Only main saves them, so a pull request does not fill the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest

      - name: Test
        run: cargo nextest run --locked

  # The release ships a Windows binary: okfs builds and its tests pass there too.
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # The compiled dependencies. Only main saves them, so a pull request does not fill the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest

      # The release stamps a tag's version into Cargo.toml and Cargo.lock, then builds with --locked.
      # Here the same stamp runs on this runner's own checkout (CRLF line endings included): a lock
      # the stamp cannot edit fails the build, as it did when a release first ran on Windows.
      - name: Stamp a release version
        shell: bash
        run: |
          scripts/stamp-version.sh 9.9.9-ci.1
          cargo metadata --locked --format-version 1 > /dev/null
          grep -A1 '^name = "okfs"' Cargo.lock | grep -q 'version = "9.9.9-ci.1"'
          git checkout -- Cargo.toml Cargo.lock

      - name: Test
        run: cargo nextest run --locked

  # The built okfs in a real browser: the keys, the palette, the zip, the key gate, and a held arrow key that must
  # paint every preview in time. Unit tests cannot see any of it (ui/e2e).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Chromium is keyed by the Playwright that wants it: bun.lock changes when the version does.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # A release build, so the held arrow key test sees okfs's real speed.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build okfs
        run: cargo build --release --locked

      - name: Install Chromium
        run: bun install --frozen-lockfile && bunx playwright install --with-deps chromium
        working-directory: ui

      - name: Test in the browser
        run: bun run e2e
        working-directory: ui
        env:
          OKFS_BIN: ${{ github.workspace }}/target/release/okfs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results
          path: target/e2e-results
          if-no-files-found: ignore
          retention-days: 7

  # okfs.jrnxf.co builds okfs's page and index from this checkout (web/README.md): a change that
  # breaks only the site fails here, not in its deploy.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The pinned Rust and wasm-opt web/tools.sh downloads.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/.build/tools
          key: web-tools-${{ runner.os }}-${{ hashFiles('web/tools.sh') }}

      - name: Build the site
        run: npm ci && npm run build
        working-directory: web

      # build.sh installed ui/'s dependencies, which the site's type check reads.
      - name: Type check the site
        run: npm run check
        working-directory: web

      - name: Clippy the engine
        run: |
          rustup target add wasm32-wasip1
          rustup component add clippy
          cargo clippy --locked --manifest-path web/engine/Cargo.toml --target wasm32-wasip1 -- -D warnings
