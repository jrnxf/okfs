name: release

# Builds okfs for Linux, macOS and Windows and publishes the binaries as a release, so a machine without nix
# or a Rust toolchain can download okfs and run it. The version the binaries report comes from the
# tag: the build writes it into Cargo.toml, so a release needs no version-bump commit.
#
# - A tag `v<version>` pushed by hand publishes that release, then points the Homebrew formula at
#   it. A tag with a hyphen publishes a pre-release: it never shows as Latest, and the formula
#   follows it only until okfs's first full release. Development builds are tagged `v<next version>-pre.N`, such as `v0.1.0-pre.1`:
#   Homebrew and Cargo order `pre` below the release, which `dev` is not to Homebrew. Every
#   pre-release carries the same archives as a full release.
# - A pull request that changes this file, the notices' settings or the dependencies builds every
#   binary and the notices without publishing, to prove the build before a release depends on it.
#   Running the workflow by hand (workflow_dispatch) does the same.
#
# - The crate job packages okfs for crates.io and installs it in a clean container with no bun, so
#   `cargo install okfs` is proven on every run. Nothing here publishes it: `publish = false` in
#   Cargo.toml holds until the first release, and `cargo publish` is run by hand.
# - The image job builds the container image from the binaries the build jobs made and runs it. The
#   image-push job, after the release is published, pushes it to ghcr.io/jrnxf/okfs as <version>, and
#   also as latest on a full release. A pull request builds the image and pushes nothing.
#
# The release's assets, each with a `.sha256`:
# - okfs-<version>-<target>.tar.gz for x86_64-unknown-linux-musl, aarch64-unknown-linux-musl,
#   aarch64-apple-darwin and x86_64-apple-darwin, and okfs-<version>-x86_64-pc-windows-msvc.zip for
#   Windows, which holds okfs.exe and completions/_okfs.ps1 (PowerShell) in place of the
#   executable okfs and the shell completions, and no manual page. The Linux binaries are static, so they run on any
#   Linux, whatever its C library. Each archive holds one folder, okfs-<version>-<target>/, with the
#   executable okfs, completions/okfs.bash, completions/_okfs (zsh), completions/okfs.fish, the
#   manual page okfs.1, README.md and LICENSE, so a package manager installs them as they are.
# - okfs-x86_64-unknown-linux-gnu: the x86-64 musl binary on its own, under the name the first
#   releases used, so a machine that downloads that name keeps getting the newest okfs.
# - okfs-third-party-notices.md: THIRD_PARTY.md, then the licenses of every Rust crate and syntax
#   definition compiled in.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - about.hbs
      - about.toml
      - build.rs
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older build pointless; a release always finishes.
concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each Linux binary is built on its own architecture, so it can be run before it ships.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          # Built on Apple silicon, as GitHub's Intel Macs are going away, and run under Rosetta.
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Git's bash on Windows, so the steps below read the same on every system.
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            # perl, not sed: the same edit on Linux and macOS. Cargo.toml's first version line is the
            # package's; in Cargo.lock it is the one after okfs's name.
            perl -0pi -e "s/^version = \".*?\"/version = \"$version\"/m" Cargo.toml
            perl -0pi -e "s/(\nname = \"okfs\"\nversion = )\".*?\"/\$1\"$version\"/" Cargo.lock
          else
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ASSET=okfs-$version-$TARGET" >> "$GITHUB_ENV"
          echo "version $version"

      # Not the nix build: that binary links against /nix/store and runs only where the same store
      # paths exist.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable

      # musl's C compiler, for the C that onig_sys and libmimalloc-sys build.
      - name: Install musl
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Run
        run: |
          bin=target/$TARGET/release/okfs
          [ "$RUNNER_OS" = Windows ] && bin=$bin.exe
          if [ "$TARGET" = x86_64-apple-darwin ]; then
            run() { arch -x86_64 "$bin" "$@"; }
          else
            run() { "$bin" "$@"; }
          fi
          reported=$(run --version)
          echo "$reported"
          if [ "$reported" != "okfs $VERSION" ]; then
            echo "expected okfs $VERSION" >&2
            exit 1
          fi
          file "$bin"
          if [ "$RUNNER_OS" = Linux ] && ! file -b "$bin" | grep -Eq 'static(ally|-pie) linked'; then
            echo "expected a static binary" >&2
            exit 1
          fi

          # The binary writes its own completions and manual page, so they match its options.
          mkdir -p "$ASSET/completions"
          run completions bash > "$ASSET/completions/okfs.bash"
          run completions zsh > "$ASSET/completions/_okfs"
          run completions fish > "$ASSET/completions/okfs.fish"
          run manpage > "$ASSET/okfs.1"
          if [ "$RUNNER_OS" = Windows ]; then
            rm "$ASSET"/completions/*
            run completions powershell > "$ASSET/completions/_okfs.ps1"
          fi

      # COPYFILE_DISABLE keeps macOS's tar from adding ._ files for extended attributes.
      - name: Package
        env:
          COPYFILE_DISABLE: 1
        run: |
          cp README.md LICENSE "$ASSET/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/$TARGET/release/okfs.exe" "$ASSET/okfs.exe"
            rm "$ASSET/okfs.1"
            7z a -tzip "$ASSET.zip" "$ASSET"
            sha256sum "$ASSET.zip" > "$ASSET.zip.sha256"
            cat "$ASSET.zip.sha256"
            7z l "$ASSET.zip"
          else
            install -m 0755 "target/$TARGET/release/okfs" "$ASSET/okfs"
            tar -czf "$ASSET.tar.gz" "$ASSET"
            shasum -a 256 "$ASSET.tar.gz" > "$ASSET.tar.gz.sha256"
            cat "$ASSET.tar.gz.sha256"
            tar -tvzf "$ASSET.tar.gz"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ASSET }}
          path: |
            ${{ env.ASSET }}.tar.gz
            ${{ env.ASSET }}.tar.gz.sha256
            ${{ env.ASSET }}.zip
            ${{ env.ASSET }}.zip.sha256
          if-no-files-found: error

  notices:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_ABOUT_VERSION: 0.9.2
      CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The syntax notices come from an example that links okfs, whose build runs bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install cargo-about
        run: |
          name=cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/$name.tar.gz"
          echo "$CARGO_ABOUT_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      # about.toml lists the accepted licenses: a crate under any other fails here.
      - name: Write the notices
        run: |
          {
            cat THIRD_PARTY.md
            echo
            cargo about generate --locked --fail about.hbs
            echo
            cargo run --quiet --locked --example syntax-notices
          } > okfs-third-party-notices.md
          grep -c '^## ' okfs-third-party-notices.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: okfs-third-party-notices
          path: okfs-third-party-notices.md
          if-no-files-found: error

  # Gathers the release's files in one artifact on every run, so a pull request proves the whole set.
  assets:
    needs: [build, notices]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true

      # Each archive must hold exactly the files the formula installs, with okfs executable.
      - name: Check and add the legacy name
        working-directory: assets
        run: |
          shasum -a 256 -c ./*.sha256
          for archive in okfs-*.tar.gz; do
            dir=${archive%.tar.gz}
            echo "$archive"
            tar -tvzf "$archive"
            listed=$(tar -tzf "$archive" | sed 's|/$||' | sort)
            expected=$(printf '%s\n' "$dir" "$dir/LICENSE" "$dir/README.md" "$dir/completions" \
              "$dir/completions/_okfs" "$dir/completions/okfs.bash" "$dir/completions/okfs.fish" \
              "$dir/okfs" "$dir/okfs.1" | sort)
            if [ "$listed" != "$expected" ]; then
              echo "$archive does not hold the expected files" >&2
              exit 1
            fi
            if ! tar -tvzf "$archive" "$dir/okfs" | grep -q '^-rwxr-xr-x'; then
              echo "$archive: okfs is not mode 0755" >&2
              exit 1
            fi
          done
          # The Windows archive holds okfs.exe and the PowerShell completions.
          for archive in okfs-*.zip; do
            dir=${archive%.zip}
            echo "$archive"
            unzip -l "$archive"
            listed=$(unzip -Z1 "$archive" | sed 's|/$||' | sort)
            expected=$(printf '%s\n' "$dir" "$dir/LICENSE" "$dir/README.md" "$dir/completions" \
              "$dir/completions/_okfs.ps1" "$dir/okfs.exe" | sort)
            if [ "$listed" != "$expected" ]; then
              echo "$archive does not hold the expected files" >&2
              exit 1
            fi
          done
          set -- okfs-*-x86_64-unknown-linux-musl.tar.gz
          tar -xzf "$1" -O "${1%.tar.gz}/okfs" > okfs-x86_64-unknown-linux-gnu
          shasum -a 256 okfs-x86_64-unknown-linux-gnu > okfs-x86_64-unknown-linux-gnu.sha256
          chmod +x okfs-x86_64-unknown-linux-gnu
          ./okfs-x86_64-unknown-linux-gnu --version
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: assets/*
          if-no-files-found: error

  # Packages the crate and installs it where bun is absent. The page is built here and packaged in,
  # as crates.io's users have no bun: build.rs embeds the packaged ui/dist when ui/package.json is
  # not there.
  crate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            perl -0pi -e "s/^version = \".*?\"/version = \"$version\"/m" Cargo.toml
            perl -0pi -e "s/(\nname = \"okfs\"\nversion = )\".*?\"/\$1\"$version\"/" Cargo.lock
          else
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version $version"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build the page
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build

      # --allow-dirty: the version above is not committed. The check build runs in the package's
      # own folder, which has no ui/package.json, so it proves the page is packaged in.
      - name: Package
        run: |
          cargo package --allow-dirty --locked
          crate=target/package/okfs-$VERSION
          ls -l "$crate.crate"
          tar -tzf "$crate.crate" | grep -E '/ui/dist/index.html$'
          if tar -tzf "$crate.crate" | grep -E '/(web|docs|tests|examples|ui/node_modules)/'; then
            echo "the crate holds files it should leave out" >&2
            exit 1
          fi

      # rust:1 has a C compiler for the C that onig_sys builds, and no bun.
      - name: Install from the package in a clean container
        run: |
          docker run --rm -v "$PWD/target/package/okfs-$VERSION:/crate:ro" rust:1 sh -c '
            ! command -v bun >/dev/null || { echo "bun is installed here" >&2; exit 1; }
            cargo install --path /crate --locked --root /tmp/okfs-root --target-dir /tmp/build &&
            /tmp/okfs-root/bin/okfs --version
          ' | tee install.txt
          grep -F "okfs $VERSION" install.txt

  # Builds the container image from the binaries the build jobs made, so nothing compiles again.
  # Builds the container image from the binaries the build jobs made, so nothing compiles again, and
  # runs it. It pushes nothing: image-push does, once the release is out.
  image:
    needs: [assets, crate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: assets

      # The version a tag names, or the one in Cargo.toml for a pull request.
      - name: Gather the binaries
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          scripts/image-context.sh assets "$version" context

      - name: Set up buildx
        run: docker buildx create --name okfs --driver docker-container --use

      # The amd64 image runs here, so a broken image fails before it is pushed. Each run lists the
      # folder it serves: hello.txt must be at the top, as the container's own root would show okfs
      # and proc instead.
      - name: Test the image
        run: |
          docker buildx build --platform linux/amd64 -f Dockerfile --tag okfs:test --load context
          docker run --rm okfs:test --version | tee image.txt
          grep -F "okfs $VERSION" image.txt
          mkdir -p srv && echo hello > srv/hello.txt

          # Starts the image with the given docker arguments, then lists the folder it serves on the
          # given port. Beyond loopback okfs asks for the key, which is in the link it prints.
          listing() {
            port=$1; shift
            id=$(docker run -d "$@")
            for _ in $(seq 40); do
              key=$(docker logs "$id" 2>&1 | grep -o 'key=[A-Za-z0-9_-]*' | head -n1 || true)
              [ -n "$key" ] && break
              sleep 0.5
            done
            curl -fsS "http://127.0.0.1:$port/api/list?path=&$key" > list.json || { docker logs "$id"; exit 1; }
            docker rm -f "$id" >/dev/null
            grep -q 'hello.txt' list.json || { cat list.json; echo "hello.txt is not at the top" >&2; exit 1; }
            if grep -Eq '"(proc|okfs)"' list.json; then
              cat list.json; echo "the container's own root is served" >&2; exit 1
            fi
          }
          user=(--user "$(id -u):$(id -g)")
          listing 8080 -p 8080:8080 -v "$PWD/srv:/srv:ro" "${user[@]}" okfs:test
          # An argument after the image name must not drop the folder.
          listing 8080 -p 8080:8080 -v "$PWD/srv:/srv:ro" "${user[@]}" okfs:test --allow-upload
          # A variable replaces the port the image sets.
          listing 9000 -p 9000:9000 -e OKFS_PORT=9000 -v "$PWD/srv:/srv:ro" "${user[@]}" okfs:test

      - name: Build both platforms
        run: docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile context

  # A tag with a hyphen is a pre-release: it gets its version tag and never latest. Runs only after
  # the release is published, so a release that fails never moves latest.
  image-push:
    if: github.event_name == 'push'
    needs: [image, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/jrnxf/okfs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: assets

      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          scripts/image-context.sh assets "$version" context
          docker buildx create --name okfs --driver docker-container --use
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tags=(--tag "$IMAGE:$version")
          case "$version" in *-*) ;; *) tags+=(--tag "$IMAGE:latest") ;; esac
          docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile "${tags[@]}" --push context

  publish:
    if: github.event_name == 'push'
    needs: [assets, crate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: assets

      - name: Publish the release
        run: |
          flags=(--generate-notes --verify-tag)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" assets/*

  # Points jrnxf/homebrew-tap's Formula/okfs.rb at this release's archives. The tap's
  # docs/automatic-updates.md issues the TAP_DEPLOY_KEY secret this needs.
  tap:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # Until okfs's first full release, brew installs the latest pre-release; after it, only full
      # releases, so a pre-release never replaces a stable okfs.
      - name: Check the formula follows this tag
        id: follow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in
            *-*)
              full=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --exclude-drafts \
                --limit 1 --json tagName --jq '.[0].tagName // ""')
              if [ -n "$full" ]; then
                echo "$full is out, so the formula stays on full releases"
                echo "bump=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
          esac
          echo "bump=true" >> "$GITHUB_OUTPUT"

      - name: Check for the tap's key
        if: steps.follow.outputs.bump == 'true'
        env:
          KEY_SET: ${{ secrets.TAP_DEPLOY_KEY != '' }}
        run: |
          if [ "$KEY_SET" != true ]; then
            echo "::error::TAP_DEPLOY_KEY is not set, so Formula/okfs.rb was not updated: see jrnxf/homebrew-tap docs/automatic-updates.md"
            exit 1
          fi

      # Pinned to a commit: this job holds the key that can push to the tap brew installs from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.follow.outputs.bump == 'true'
        with:
          repository: jrnxf/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      # The binary mode downloads each asset from the release and checks it against its .sha256.
      - if: steps.follow.outputs.bump == 'true'
        run: |
          version=${TAG#v}
          scripts/bump-formula.sh okfs "$TAG" \
            macos-arm="okfs-$version-aarch64-apple-darwin.tar.gz" \
            macos-intel="okfs-$version-x86_64-apple-darwin.tar.gz" \
            linux-arm="okfs-$version-aarch64-unknown-linux-musl.tar.gz" \
            linux-intel="okfs-$version-x86_64-unknown-linux-musl.tar.gz"

      - if: steps.follow.outputs.bump == 'true'
        run: |
          if git diff --quiet; then
            echo "Formula/okfs.rb already points at $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "okfs $TAG"
          git push
